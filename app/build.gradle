plugins {
    id 'com.android.application'
}

android {
    namespace 'com.moddys.resonance'
    compileSdk 36

    defaultConfig {
        applicationId "com.moddys.resonance"
        minSdk 26            // 2017+; also lets us use Notification.Builder(context, channel)
        targetSdk 36         // Play requires API 36 for new apps/updates since 2026-08-31
        versionCode 12
        versionName "2.0.5-beta"
    }

    /* Two delivery channels from one code base, same application id.
       sideload: today's build - it reads the update feed on moddys.net and hands the new APK to
                 the system installer. This is what the site serves and what CI publishes.
       play:     Play policy forbids REQUEST_INSTALL_PACKAGES for a player like this and the app
                 is a local asset player, so this flavour keeps no network permission at all and
                 compiles the self-updater out (see app/src/play/AndroidManifest.xml and
                 BuildConfig.SELF_UPDATE). Play delivers the updates. */
    flavorDimensions "channel"
    productFlavors {
        sideload {
            dimension "channel"
            buildConfigField "boolean", "SELF_UPDATE", "true"
        }
        play {
            dimension "channel"
            buildConfigField "boolean", "SELF_UPDATE", "false"
        }
    }

    buildFeatures {
        // AGP 8 defaults this off; the flavour guard in Updates reads BuildConfig.SELF_UPDATE
        buildConfig true
    }

    signingConfigs {
        release {
            // Filled in from CI secrets (see .github/workflows/release.yml). When the env
            // var is absent - any normal local build - the release variant is simply left
            // unsigned rather than failing the build.
            def ksPath = System.getenv("KEYSTORE_FILE")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        debug {
            // side-loadable; signed with the CI debug key
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            // R8: the payload is assets, so the size win is small; what it buys is a dex
            // that cannot be read back class-by-class at the store
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Release packages the minified page; the readable sources stay in src/main/assets/www.
    // A variant source set outranks main for the same path, so only the .js files need to be
    // generated here - every other asset still comes from main.
    sourceSets {
        release {
            assets.srcDirs += new File(buildDir, "generated/minifiedPage").absolutePath
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        // the adaptive icon is the real launcher icon; the density PNGs are fallbacks for
        // launchers that cannot read it, and their square shape is deliberate
        disable 'IconLauncherShape'
    }
}

// Minify the page's JavaScript for the release package only.
//
// Sources under app/src/main/assets/www stay readable. This writes minified copies of just
// the .js files into build/generated/minifiedPage/www, which the release source set adds to
// its assets; a variant source set outranks main for the same path, so packaging picks these
// up and everything else still comes from main. terser runs through npx: a machine without
// Node still builds - it copies the file verbatim and says so.
def minifyPageJs = tasks.register("minifyPageJs") {
    def srcRoot = file("src/main/assets/www")
    def outRoot = file("$buildDir/generated/minifiedPage/www")
    inputs.dir(srcRoot)
    outputs.dir(outRoot)
    doLast {
        delete outRoot
        def npx = System.getProperty("os.name").toLowerCase().contains("windows") ?
                ["cmd", "/c", "npx"] : ["npx"]
        int done = 0, failed = 0
        fileTree(srcRoot) { include "**/*.js" }.each { f ->
            def rel = srcRoot.toPath().relativize(f.toPath()).toString()
            def dst = new File(outRoot, rel)
            dst.parentFile.mkdirs()
            try {
                def p = new ProcessBuilder(npx + ["--yes", "terser@5", f.absolutePath,
                                                  "-c", "-m", "-o", dst.absolutePath])
                        .redirectErrorStream(true).start()
                def text = p.inputStream.text
                if (p.waitFor() == 0 && dst.isFile() && dst.length() > 0) {
                    done++
                } else {
                    failed++
                    dst.bytes = f.bytes          // verbatim fallback: still a valid asset
                    logger.warn("minify: terser failed on ${rel}: ${text.take(160)}")
                }
            } catch (Exception e) {
                failed++
                dst.bytes = f.bytes
                logger.warn("minify: ${e.message} on ${rel}")
            }
        }
        logger.lifecycle("minify: ${done} JavaScript file(s) minified for release, ${failed} verbatim")
    }
}

// The merge task is created lazily by AGP after the variants are configured, so match it
// lazily too rather than by name at evaluation time. Lint reads the same asset tree, so it
// needs the same dependency or Gradle refuses the graph as an implicit dependency.
tasks.configureEach { t ->
    if (t.name != "minifyPageJs" && t.name.contains("Release") && !t.name.contains("clean")) {
        t.dependsOn minifyPageJs
    }
}

// A flavoured build writes its artefacts under the flavour's own directory
// (outputs/apk/sideload/release/app-sideload-release.apk). Everything that already publishes
// this app - .github/workflows/release.yml, tools/apk_identity.py, the install snippets - reads
// outputs/apk/release/app-release.apk, so the sideload channel is mirrored (and renamed) back to
// that exact path: after a build it is the current sideload APK, not a leftover.
// Only the sideload channel: the play build leaves through Play, never through the site.
def mirrorSideloadApk = tasks.register("mirrorSideloadReleaseApk", Copy) {
    from("$buildDir/outputs/apk/sideload/release") {
        include "*.apk"
        rename { "app-release.apk" }
    }
    into("$buildDir/outputs/apk/release")
    doLast { logger.lifecycle("sideload channel mirrored to build/outputs/apk/release/app-release.apk") }
}

def mirrorSideloadBundle = tasks.register("mirrorSideloadReleaseBundle", Copy) {
    from("$buildDir/outputs/bundle/sideloadRelease") {
        include "*.aab"
        rename { "app-release.aab" }
    }
    into("$buildDir/outputs/bundle/release")
}

// The debug channel has the same problem: .github/workflows/android.yml uploads
// outputs/apk/debug/*.apk, which a flavoured build writes to outputs/apk/sideload/debug.
def mirrorSideloadDebug = tasks.register("mirrorSideloadDebugApk", Copy) {
    from("$buildDir/outputs/apk/sideload/debug") {
        include "*.apk"
        rename { "app-debug.apk" }
    }
    into("$buildDir/outputs/apk/debug")
}

tasks.configureEach { t ->
    if (t.name == "assembleSideloadRelease") t.finalizedBy mirrorSideloadApk
    if (t.name == "bundleSideloadRelease") t.finalizedBy mirrorSideloadBundle
    if (t.name == "assembleSideloadDebug") t.finalizedBy mirrorSideloadDebug
}

// Flavours give AGP one lint task per variant (lintSideloadRelease, lintPlayRelease) and no
// build-type one, so the documented gate `./gradlew :app:lintRelease` would die with "task is
// ambiguous". Keep that name meaning "lint everything this release ships": both channels.
tasks.register("lintRelease") {
    group = "verification"
    description = "Lint both release variants (sideload and play)."
    dependsOn "lintSideloadRelease", "lintPlayRelease"
}
