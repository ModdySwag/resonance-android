name: Build APK

# Builds a side-loadable debug APK on every push. No local Android toolchain needed -
# that is the whole point of doing it here rather than on the dev machine.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      sync_from_site:
        description: 'Pull the latest web app from moddys.net before building'
        type: boolean
        default: false

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure the exact SDK components this build targets
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Optional: ship whatever is live right now instead of the committed snapshot.
      - name: Refresh the web app from the live site
        if: ${{ inputs.sync_from_site == true }}
        run: python3 tools/sync-assets.py --from-url

      - name: Verify the bundled web app against its manifest
        run: |
          python3 - <<'PY'
          import hashlib, json, sys, glob
          man = json.load(open("assets-manifest.json"))
          bad = []
          for rel, want in man["files"].items():
              try:
                  data = open("app/src/main/assets/www/" + rel, "rb").read()
              except OSError:
                  bad.append(rel + ": missing")
                  continue
              if hashlib.sha256(data).hexdigest() != want:
                  bad.append(rel + ": hash differs from the manifest")
          for name in ("_shell_shim.js", "compat.json"):
              p = "app/src/main/assets/www/" + name
              open(p, "rb").close()
          zips = glob.glob("app/src/main/assets/www/app/pack/*.zip")
          if len(zips) != 19:
              bad.append(f"expected 19 pack zips, found {len(zips)}")
          html = open("app/src/main/assets/www/app/index.html", encoding="utf-8").read()
          for want in ("studio.css", "app.js", "engine.js", "viz.js", "worklet-processor.js"):
              if want not in html:
                  bad.append("index.html no longer references " + want)
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print(f"assets ok: {len(man['files'])} files match the manifest, 19 pack zips, index references intact")
          PY
          node --check app/src/main/assets/www/_shell_shim.js
          python3 -c "import json; json.load(open('app/src/main/assets/www/compat.json')); print('compat.json parses')"

      - name: Build
        run: gradle :app:assembleDebug --stacktrace

      - name: Show what was produced
        run: ls -la app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: resonance-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  shim:
    name: Shell shim (real browser)
    runs-on: ubuntu-latest

    # The shim is injected at runtime, so it can be driven in a real browser. The page under
    # test is the bundled copy - the same bytes the app ships.
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Check the compatibility spec parses
        run: python -c "import json; json.load(open('app/src/main/assets/www/compat.json'))"

      - name: Drive the shim on the real page
        run: python tools/shim_harness.py
